appId: com.petstudio.lite
productName: Pet Studio Lite
directories:
  output: release
  buildResources: build-resources
afterPack: ./scripts/after-pack.cjs
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
extraResources:
  - from: build-resources/runtime-template
    to: runtime-template
    filter:
      - win-x64.zip
      - win-x64.zip.json

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: "-"

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
